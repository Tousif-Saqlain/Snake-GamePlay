<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SnakeMania - Ek Gaming Katha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="app-container">
        <!-- Top Header & HUD -->
        <header class="game-header">
            <div class="brand">
                <h1>Snake<span>Mania</span></h1>
                <p>Ek Gaming Katha</p>
            </div>
            <div class="header-actions">
                <button id="pauseBtn" class="icon-btn" aria-label="Pause or Resume" title="Pause (Space)">
                    ⏸
                </button>
                <button id="soundBtn" class="icon-btn" aria-label="Toggle Sound" title="Mute / Unmute">
                    🔊
                </button>
            </div>
        </header>

        <!-- Scoreboard -->
        <section class="stats-bar">
            <div class="stat-card">
                <span class="stat-label">SCORE</span>
                <span id="scoreBox" class="stat-value">0</span>
            </div>
            <div class="stat-card highlight">
                <span class="stat-label">BEST</span>
                <span id="hiscoreBox" class="stat-value">0</span>
            </div>
        </section>

        <!-- Game Board Container -->
        <section class="board-wrapper">
            <div id="board" aria-label="Snake Game Board"></div>

            <!-- Start / Pause / Game Over Overlay -->
            <div id="overlay" class="overlay">
                <div class="overlay-card">
                    <h2 id="overlayTitle">SnakeMania</h2>
                    <p id="overlaySubtitle">Swipe, tap the pad, or use Arrow / WASD keys.</p>
                    
                    <div id="finalScoreWrap" class="final-score hidden">
                        <span>Final Score</span>
                        <strong id="finalScoreValue">0</strong>
                    </div>

                    <div class="difficulty-selector" id="difficultyGroup">
                        <button class="diff-btn" data-speed="7">Chill</button>
                        <button class="diff-btn active" data-speed="10">Classic</button>
                        <button class="diff-btn" data-speed="14">Turbo</button>
                    </div>

                    <button id="startBtn" class="primary-btn">Play Now</button>
                </div>
            </div>
        </section>

        <!-- Mobile D-Pad Controls -->
        <section class="controls-pad" aria-label="Touch Controls">
            <button class="ctrl-btn up" data-dir="UP" aria-label="Move Up">▲</button>
            <button class="ctrl-btn left" data-dir="LEFT" aria-label="Move Left">◀</button>
            <button class="ctrl-btn down" data-dir="DOWN" aria-label="Move Down">▼</button>
            <button class="ctrl-btn right" data-dir="RIGHT" aria-label="Move Right">▶</button>
        </section>
    </main>

    <script src="js/index.js"></script>
</body>
</html>
